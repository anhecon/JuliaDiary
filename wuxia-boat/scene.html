<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlit River Boat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Cormorant+Garamond:ital,wght@1,500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: 100vw; max-width: calc(100vh * 16 / 9); height: auto; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// 月下扁舟 — "A Boat Beneath the Moon"
// A deterministic canvas animation: renderAt(t) draws the frame at time t (seconds).
// Open the page to watch it loop live; render.cjs captures it frame by frame into an MP4.

const W = 1280, H = 720, DUR = 20, HORIZON = 432;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const sky = document.createElement('canvas');
sky.width = W; sky.height = HORIZON;
const sctx = sky.getContext('2d');

const boatC = document.createElement('canvas');
boatC.width = 1100; boatC.height = 430;
const bctx = boatC.getContext('2d');
const BS = 1.35;               // boat scale
const BOX = 550, BOY = 392; // waterline centre of the boat inside boatC

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = (e0, e1, x) => { const u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * (3 - 2 * u); };
const fadeWin = (t, a, b, c, d) => smooth(a, b, t) * (1 - smooth(c, d, t));
const mod = (a, n) => ((a % n) + n) % n;

function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- world data
const R = rng(7);
const stars = Array.from({ length: 150 }, () => ({
  x: R() * W, y: Math.pow(R(), 1.7) * HORIZON * 0.6, r: R() * 1.1 + 0.3, ph: R() * TAU, sp: 0.8 + R() * 2.2,
}));

function makePeaks(seed, spacing, hMin, hMax, wMin, wMax) {
  const r = rng(seed), peaks = [];
  for (let x = -500; x < 3400; x += spacing * (0.55 + r() * 0.9)) {
    peaks.push({ c: x, h: lerp(hMin, hMax, r()), w: lerp(wMin, wMax, r()), sharp: 1.9 + r() * 1.1 });
  }
  return peaks;
}

const layers = [
  { peaks: makePeaks(11, 120, 90, 215, 36, 70), par: 0.10, base: HORIZON, top: '#86729c', bot: '#e8b19a', mist: 'rgba(246,196,176,', fog: 0.6, rim: 0.10 },
  { peaks: makePeaks(23, 150, 70, 175, 32, 62), par: 0.22, base: HORIZON + 1, top: '#51477a', bot: '#c9919c', mist: 'rgba(226,170,170,', fog: 0.5, rim: 0.14 },
  { peaks: makePeaks(37, 240, 45, 150, 40, 78), par: 0.42, base: HORIZON + 2, top: '#211d3d', bot: '#6c5478', mist: 'rgba(170,130,160,', fog: 0.4, rim: 0.18 },
];

const R2 = rng(99);
const skyLanterns = Array.from({ length: 18 }, (_, i) => ({
  x: 80 + R2() * (W - 160), t0: 4.5 + i * 0.55 + R2() * 0.8, sp: 12 + R2() * 10, s: 0.55 + R2() * 0.6, ph: R2() * TAU,
}));

const R3 = rng(5);
const riverLanterns = Array.from({ length: 11 }, () => ({
  x: R3() * 1700, d: 0.12 + R3() * 0.85, sp: 5 + R3() * 7, ph: R3() * TAU,
}));

const R4 = rng(42);
const petals = Array.from({ length: 75 }, () => ({
  x0: R4() * W * 1.4, y0: R4() * H, vx: -(22 + R4() * 30), vy: 16 + R4() * 22,
  s: 1.4 + Math.pow(R4(), 2.5) * 5, rot: R4() * TAU, rs: (R4() - 0.5) * 3, ph: R4() * TAU, sw: 10 + R4() * 25,
  c: R4() < 0.5 ? '247,182,198' : '252,214,222',
}));

const R5 = rng(77);
const fireflies = Array.from({ length: 28 }, () => ({
  x: R5() * W, y: HORIZON - 40 + R5() * 230, ph: R5() * TAU, f: 0.3 + R5() * 0.5, a: 20 + R5() * 40,
}));

const R6 = rng(3);
const glints = Array.from({ length: 110 }, () => ({
  x: R6() * W * 1.6, d: Math.pow(R6(), 0.8), l: 6 + R6() * 26, ph: R6() * TAU,
}));

// ---------------------------------------------------------------- helpers
function glow(g, x, y, r, color, a) {
  const rg = g.createRadialGradient(x, y, 0, x, y, r);
  rg.addColorStop(0, `rgba(${color},${a})`);
  rg.addColorStop(0.35, `rgba(${color},${a * 0.35})`);
  rg.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = rg;
  g.fillRect(x - r, y - r, r * 2, r * 2);
}

// A tapered, fluttering strip (hair, silk ribbons, sashes). Angles: 0 = right, PI/2 = down.
function ribbon(g, x0, y0, len, w0, w1, ang0, bend, t, amp, freq, speed, fill) {
  const n = 22, step = len / n, pts = [[x0, y0]];
  let x = x0, y = y0;
  for (let i = 1; i <= n; i++) {
    const u = i / n;
    const a = ang0 + bend * u + Math.sin(u * freq - t * speed) * amp * u;
    x += Math.cos(a) * step; y += Math.sin(a) * step;
    pts.push([x, y]);
  }
  const L = [], Rr = [];
  for (let i = 0; i <= n; i++) {
    const p = pts[i], q = pts[Math.min(n, i + 1)], o = pts[Math.max(0, i - 1)];
    let dx = q[0] - o[0], dy = q[1] - o[1];
    const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const w = lerp(w0, w1, i / n) / 2;
    L.push([p[0] - dy * w, p[1] + dx * w]);
    Rr.push([p[0] + dy * w, p[1] - dx * w]);
  }
  g.beginPath();
  g.moveTo(L[0][0], L[0][1]);
  for (const p of L) g.lineTo(p[0], p[1]);
  for (let i = Rr.length - 1; i >= 0; i--) g.lineTo(Rr[i][0], Rr[i][1]);
  g.closePath();
  g.fillStyle = fill;
  g.fill();
}

function limb(g, pts, width, color) {
  g.strokeStyle = color; g.lineWidth = width; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.stroke();
}

function poly(g, pts, fill) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath(); g.fillStyle = fill; g.fill();
}

// ---------------------------------------------------------------- sky + mountains
function drawLayer(g, L, cam) {
  const off = cam * L.par, pts = [];
  let maxH = 0;
  for (let sx = -8; sx <= W + 8; sx += 4) {
    const x = sx + off;
    let h = 10 + 6 * Math.sin(x * 0.013 + L.par * 10) + 4 * Math.sin(x * 0.031);
    for (const p of L.peaks) {
      const d = Math.abs(x - p.c) / p.w;
      if (d < 3) { const v = p.h * Math.exp(-Math.pow(d, p.sharp)); if (v > h) h = v; }
    }
    pts.push([sx, L.base - h]);
    if (h > maxH) maxH = h;
  }
  const gr = g.createLinearGradient(0, L.base - maxH, 0, L.base);
  gr.addColorStop(0, L.top); gr.addColorStop(1, L.bot);
  g.beginPath(); g.moveTo(-8, L.base + 2);
  for (const [x, y] of pts) g.lineTo(x, y);
  g.lineTo(W + 8, L.base + 2); g.closePath();
  g.fillStyle = gr; g.fill();
  // moonlit rim along the ridge
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (const [x, y] of pts) g.lineTo(x, y);
  g.strokeStyle = `rgba(255,226,214,${L.rim})`; g.lineWidth = 1.4; g.stroke();
  // mist pooling at the foot of the range
  const m = g.createLinearGradient(0, L.base - 95, 0, L.base);
  m.addColorStop(0, L.mist + '0)'); m.addColorStop(1, L.mist + L.fog + ')');
  g.fillStyle = m; g.fillRect(0, L.base - 95, W, 97);
}

function mistBand(g, y, t, seed, alpha, color) {
  const r = rng(seed);
  for (let i = 0; i < 6; i++) {
    const w = 240 + r() * 320;
    const x = mod(r() * W * 1.5 + t * (6 + r() * 9), W + w * 2) - w;
    const yy = y + (r() - 0.5) * 26;
    g.save(); g.translate(x, yy); g.scale(1, 0.11);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, w);
    rg.addColorStop(0, color + alpha + ')'); rg.addColorStop(1, color + '0)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, w, 0, TAU); g.fill();
    g.restore();
  }
}

function drawSkyLanterns(g, t) {
  for (const L of skyLanterns) {
    if (t < L.t0) continue;
    const age = t - L.t0;
    const y = HORIZON - 40 - age * L.sp;
    const x = L.x + Math.sin(age * 0.6 + L.ph) * 10 + age * 3;
    const s = L.s * (1 - clamp(age / 30, 0, 0.45));
    const a = smooth(0, 1.2, age) * (0.75 + 0.25 * Math.sin(t * 7 + L.ph));
    g.save(); g.globalCompositeOperation = 'lighter';
    glow(g, x, y, 26 * s, '255,150,70', 0.55 * a);
    g.restore();
    g.globalAlpha = smooth(0, 1.2, age);
    const bw = 7 * s, bh = 10 * s;
    const lg = g.createLinearGradient(0, y - bh, 0, y + bh);
    lg.addColorStop(0, '#ffe7a8'); lg.addColorStop(1, '#f2873a');
    g.fillStyle = lg;
    g.beginPath();
    g.moveTo(x - bw * 0.75, y - bh); g.lineTo(x + bw * 0.75, y - bh);
    g.lineTo(x + bw, y + bh); g.lineTo(x - bw, y + bh); g.closePath(); g.fill();
    g.globalAlpha = 1;
  }
}

function drawSky(t, cam) {
  const g = sctx;
  const gr = g.createLinearGradient(0, 0, 0, HORIZON);
  gr.addColorStop(0, '#11163a');
  gr.addColorStop(0.32, '#2b2c5e');
  gr.addColorStop(0.6, '#6c4a7c');
  gr.addColorStop(0.82, '#c97b84');
  gr.addColorStop(1, '#f4b98e');
  g.fillStyle = gr; g.fillRect(0, 0, W, HORIZON);

  for (const s of stars) {
    const a = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph))) * (1 - s.y / (HORIZON * 0.6)) * 0.9;
    g.fillStyle = `rgba(255,246,230,${a})`;
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.fill();
  }

  // the moon, rising slowly
  const mx = 960, my = 168 - t * 1.4;
  g.save(); g.globalCompositeOperation = 'lighter';
  glow(g, mx, my, 300, '255,214,190', 0.28);
  glow(g, mx, my, 110, '255,240,220', 0.35);
  g.restore();
  const mg = g.createRadialGradient(mx - 14, my - 14, 4, mx, my, 50);
  mg.addColorStop(0, '#fffbef'); mg.addColorStop(1, '#f6e3c4');
  g.fillStyle = mg; g.beginPath(); g.arc(mx, my, 48, 0, TAU); g.fill();
  g.fillStyle = 'rgba(205,180,160,0.22)';
  for (const [dx, dy, r] of [[-14, -8, 11], [12, 10, 8], [6, -18, 6], [-6, 18, 7], [20, -4, 5]]) {
    g.beginPath(); g.arc(mx + dx, my + dy, r, 0, TAU); g.fill();
  }

  // thin clouds drifting across the moon
  mistBand(g, 205, t * 1.6, 501, 0.16, 'rgba(255,215,215,');
  mistBand(g, 120, t * 1.2, 502, 0.10, 'rgba(230,200,230,');

  drawLayer(g, layers[0], cam);
  mistBand(g, HORIZON - 40, t, 601, 0.35, 'rgba(250,206,186,');
  drawLayer(g, layers[1], cam);
  mistBand(g, HORIZON - 22, t * 1.3, 602, 0.32, 'rgba(236,180,178,');
  drawSkyLanterns(g, t);
  drawLayer(g, layers[2], cam);
  mistBand(g, HORIZON - 6, t * 1.6, 603, 0.30, 'rgba(210,160,180,');
}

// ---------------------------------------------------------------- water
function drawWater(t, cam) {
  const wh = H - HORIZON;
  const g = ctx.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, '#b47b88'); g.addColorStop(0.25, '#4a3f6e'); g.addColorStop(1, '#0b0d22');
  ctx.fillStyle = g; ctx.fillRect(0, HORIZON, W, wh);

  // rippled mirror of the sky and mountains
  ctx.save(); ctx.globalAlpha = 0.62;
  for (let r = 0; r < wh; r += 2) {
    const d = r / wh, amp = 1.2 + d * 13;
    const dx = Math.sin(r * 0.23 - t * 2.4) * amp * 0.6 + Math.sin(r * 0.061 + t * 1.1) * amp * 0.4;
    const sy = HORIZON - 3 - r * 0.92;
    if (sy < 0) break;
    ctx.drawImage(sky, 0, sy, W, 2, dx - 20, HORIZON + r, W + 40, 2);
  }
  ctx.restore();

  const g2 = ctx.createLinearGradient(0, HORIZON, 0, H);
  g2.addColorStop(0, 'rgba(14,14,40,0)'); g2.addColorStop(1, 'rgba(6,8,24,0.62)');
  ctx.fillStyle = g2; ctx.fillRect(0, HORIZON, W, wh);

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // moon path glitter
  const mx = 960;
  for (let i = 0; i < 64; i++) {
    const y = HORIZON + 4 + i * 4.5;
    if (y > H) break;
    const d = (y - HORIZON) / wh;
    const n = 0.5 + 0.5 * Math.sin(i * 12.9898 + t * (2.5 + (i % 5) * 0.7));
    const w = (8 + d * 70) * (0.25 + 0.75 * n);
    const x = mx + Math.sin(i * 1.7 + t * 2.6) * (4 + d * 14);
    ctx.strokeStyle = `rgba(255,236,206,${0.5 * (1 - d * 0.55) * (0.4 + 0.6 * n)})`;
    ctx.lineWidth = 1.2 + d * 2.2;
    ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2, y); ctx.stroke();
  }
  // drifting surface glints
  for (const gl of glints) {
    const y = HORIZON + 6 + gl.d * (wh - 10);
    const x = mod(gl.x - t * (8 + gl.d * 10) - cam * (0.5 + gl.d * 0.6), W + 120) - 60;
    const a = (0.06 + 0.12 * gl.d) * (0.5 + 0.5 * Math.sin(t * 1.7 + gl.ph));
    ctx.strokeStyle = `rgba(255,214,220,${a})`; ctx.lineWidth = 1 + gl.d;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + gl.l * (0.4 + gl.d), y); ctx.stroke();
  }
  ctx.restore();
}

function drawRiverLantern(L, t, cam) {
  const wh = H - HORIZON;
  const y = HORIZON + 14 + L.d * (wh - 40) + Math.sin(t * 1.3 + L.ph) * 1.2;
  const s = 0.35 + L.d * 0.95;
  const x = mod(L.x - t * L.sp - cam * (0.5 + L.d * 0.6), W + 220) - 110;
  const fl = 0.85 + 0.15 * Math.sin(t * 9 + L.ph * 3);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  glow(ctx, x, y - 8 * s, 46 * s, '255,160,90', 0.42 * fl);
  ctx.save(); ctx.translate(x, y + 16 * s); ctx.scale(0.22, 1);
  glow(ctx, 0, 0, 40 * s, '255,160,90', 0.3 * fl);
  ctx.restore(); ctx.restore();
  ctx.fillStyle = '#4a2338';
  ctx.beginPath(); ctx.ellipse(x, y, 11 * s, 3 * s, 0, 0, TAU); ctx.fill();
  for (let k = -2; k <= 2; k++) {
    const bx = x + k * 3.6 * s, tipx = x + k * 5.4 * s, tipy = y - (11 - Math.abs(k) * 2.6) * s;
    const pg = ctx.createLinearGradient(0, tipy, 0, y);
    pg.addColorStop(0, '#ffe0e6'); pg.addColorStop(1, '#e0628a');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(bx - 3.4 * s, y);
    ctx.quadraticCurveTo(bx - 3.2 * s, tipy + 3 * s, tipx, tipy);
    ctx.quadraticCurveTo(bx + 3.2 * s, tipy + 3 * s, bx + 3.4 * s, y);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = `rgba(255,236,160,${fl})`;
  ctx.beginPath(); ctx.ellipse(x, y - 12.5 * s, 1.6 * s, 3 * s, 0, 0, TAU); ctx.fill();
}

// ---------------------------------------------------------------- the boat and its two passengers
function poleGeom(t) {
  const ph = t * TAU / 3.2;
  const s = Math.sin(ph), c = Math.cos(ph);
  const F = [-118, -12];                                  // her feet on the deck
  const theta = Math.PI * 0.615 + 0.09 * s;               // pole slants down and back
  const d = [Math.cos(theta), Math.sin(theta)];
  const h1 = [F[0] + 16 + 3 * s, F[1] - 104 + 2 * c];     // upper hand
  const h2 = [h1[0] + d[0] * 24, h1[1] + d[1] * 24];      // lower hand
  const top = [h1[0] - d[0] * 40, h1[1] - d[1] * 40];
  const k = (0 - h1[1]) / d[1];
  const entry = [h1[0] + d[0] * k, h1[1] + d[1] * k];     // where the pole meets the river
  return { F, d, h1, h2, top, entry, s, c };
}

const SKIN = '#f2d6c4', HAIR = '#0d0a12';

function drawWoman(g, t) {
  const P = poleGeom(t);
  const [fx, fy] = P.F;
  const at = (x, y) => [fx + x, fy + y];
  const wind = 1 + 0.25 * Math.sin(t * 0.7);

  // pink silk shawl, trailing far behind
  ribbon(g, ...at(-6, -94), 150 * wind, 6, 3.5, 2.55, 0.35, t, 0.55, 8, 4.2, 'rgba(244,166,190,0.72)');
  // long black hair
  ribbon(g, ...at(-5, -113), 92, 10, 1.5, 1.72, 0.95 * wind, t, 0.32, 9, 5, HAIR);
  ribbon(g, ...at(-3, -110), 70, 6, 1, 1.85, 0.7 * wind, t + 0.4, 0.38, 8, 5.4, '#1a1420');
  // sword strapped across her back
  limb(g, [at(-15, -70), at(-2, -122)], 4, '#2a1e1c');
  limb(g, [at(-3.5, -117), at(1, -130)], 2.6, '#c9a35a');
  limb(g, [at(-6, -116), at(-0.5, -119)], 2.4, '#e2c27a');
  ribbon(g, ...at(1, -130), 26, 2.2, 1, 2.6, 0.4, t, 0.6, 7, 6, '#c42c36');

  // far arm reaches up to the top of the pole
  limb(g, [at(4, -96), at(11, -100), [P.h1[0], P.h1[1]]], 4.2, '#d9d0d8');

  // red underskirt, then the white gown over it
  const fl = Math.sin(t * 4.2) * 3, fl2 = Math.sin(t * 5.1 + 1) * 2;
  poly(g, [at(-9, -66), at(9, -66), at(14, -30), at(17, 2), at(-8, 3), at(-30, 1 + fl2), at(-40 + fl, -3), at(-24, -34)], '#b82a36');
  const sg = g.createLinearGradient(fx, fy - 68, fx, fy);
  sg.addColorStop(0, '#fbf6f0'); sg.addColorStop(1, '#d8cdd9');
  const hem = [];
  for (let i = 0; i <= 8; i++) {
    const u = i / 8;
    hem.push(at(lerp(13, -34 + fl, u), -3 + Math.sin(u * 9 - t * 5) * 1.6 - u * 3));
  }
  poly(g, [at(-8, -68), at(7, -68), at(11, -34), ...hem, at(-30 + fl * 0.6, -14), at(-20, -36)], sg);

  // torso, collar, sash
  poly(g, [at(-8, -68), at(-9, -90), at(-6, -97), at(-1, -100), at(4, -100), at(7, -96), at(9, -84), at(7, -68)], '#f6f0ea');
  limb(g, [at(1, -100), at(6.5, -88)], 1.6, '#c42c36');
  poly(g, [at(-9, -74), at(8.5, -74), at(8, -65), at(-8.5, -65)], '#b82a36');
  ribbon(g, ...at(-8, -69), 52, 3, 1.6, 2.3, 0.45, t, 0.5, 8, 5.5, '#b82a36');
  ribbon(g, ...at(-8, -67), 44, 2.4, 1.2, 2.0, 0.6, t + 0.7, 0.55, 8, 6, '#d24452');

  // head
  poly(g, [at(-0.5, -104), at(3.5, -104), at(3.5, -98), at(-0.5, -98)], SKIN);
  g.fillStyle = SKIN; g.beginPath(); g.arc(...at(1.8, -109), 7.4, 0, TAU); g.fill();
  g.fillStyle = HAIR;
  g.beginPath(); g.arc(...at(1.8, -109), 8.2, Math.PI * 0.62, Math.PI * 1.8); g.lineTo(...at(2, -106)); g.closePath(); g.fill();
  g.beginPath(); g.arc(...at(-2.5, -119.5), 5.6, 0, TAU); g.fill();
  g.beginPath(); g.arc(...at(2.5, -122), 3.6, 0, TAU); g.fill();
  limb(g, [at(-9, -121), at(6, -124.5)], 1.3, '#e2c27a');
  const dang = Math.sin(t * 3) * 1.5;
  limb(g, [at(6, -124.5), at(7 + dang, -116)], 0.7, '#e2c27a');
  g.fillStyle = '#fff6e0'; g.beginPath(); g.arc(...at(7 + dang, -115.5), 1.2, 0, TAU); g.fill();
  limb(g, [at(5, -110), at(7.5, -110.3)], 0.9, '#2a1a1a');
  g.fillStyle = '#c8384a'; g.beginPath(); g.arc(...at(8, -104.6), 0.9, 0, TAU); g.fill();
  // crimson hair ribbons from the bun
  ribbon(g, ...at(-6, -120), 72 * wind, 2.6, 1.2, 2.9, 0.25, t, 0.5, 9, 5.6, '#c42c36');
  ribbon(g, ...at(-6, -118), 60 * wind, 2.2, 1, 2.75, 0.3, t + 0.5, 0.55, 9, 6, '#e05566');

  // bamboo pole (the part above the water — the boat canvas is clipped at the waterline)
  limb(g, [P.top, P.entry], 3, '#6f6a3a');
  limb(g, [P.top, [lerp(P.top[0], P.entry[0], 0.5), lerp(P.top[1], P.entry[1], 0.5)]], 1, 'rgba(230,220,160,0.35)');

  // near arm to the lower hand, with its long drooping sleeve
  const elbow = at(1, -80);
  limb(g, [at(1, -95), elbow, P.h2], 4.6, '#f3ede8');
  const sw = Math.sin(t * 4.6) * 3;
  poly(g, [elbow, P.h2, [P.h2[0] - 4, P.h2[1] + 8], [elbow[0] - 10 + sw, elbow[1] + 24], [elbow[0] - 6, elbow[1] + 4]], 'rgba(246,240,236,0.92)');
  g.fillStyle = SKIN;
  g.beginPath(); g.arc(...P.h1, 2.3, 0, TAU); g.fill();
  g.beginPath(); g.arc(...P.h2, 2.4, 0, TAU); g.fill();
  // front strand of the shawl, looping from the elbow
  ribbon(g, elbow[0], elbow[1] + 4, 95 * wind, 5, 3, 1.95, 0.75, t + 1.3, 0.5, 8, 4.6, 'rgba(250,184,204,0.68)');
}

function drawMan(g, t) {
  const ox = -42, oy = -12;
  const at = (x, y) => [ox + x, oy + y];
  const breath = Math.sin(t * 1.4) * 0.6;

  // hair down his back and a pale ribbon from the topknot
  ribbon(g, ...at(3, -60), 40, 7, 2, 1.45, 0.15, t, 0.12, 6, 2.5, HAIR);
  ribbon(g, ...at(1, -67), 42, 2.2, 1.2, 3.0, 0.2, t, 0.5, 9, 5.4, '#dfe6f2');

  // seated, legs crossed
  poly(g, [at(20, 0), at(22, -10), at(6, -16), at(-18, -15), at(-27, -10), at(-26, 0)], '#2c3a63');
  limb(g, [at(-25, -1), at(19, -1)], 1.4, 'rgba(160,180,230,0.45)');
  // torso leaning toward her
  poly(g, [at(11, -12), at(-9, -14), at(-10, -46 + breath), at(5, -47 + breath)], '#34446f');
  poly(g, [at(5, -47 + breath), at(-1, -47 + breath), at(-6, -30), at(2, -14), at(11, -12)], '#232d4d');
  limb(g, [at(-4, -47 + breath), at(-7, -36)], 1.6, '#ece6dc');

  // head
  g.fillStyle = SKIN; g.beginPath(); g.arc(...at(-4, -55 + breath), 7.6, 0, TAU); g.fill();
  g.fillStyle = HAIR;
  g.beginPath(); g.arc(...at(-4, -55 + breath), 8.4, -Math.PI * 0.72, Math.PI * 0.36); g.lineTo(...at(-3, -53)); g.closePath(); g.fill();
  g.beginPath(); g.arc(...at(-1, -66 + breath), 4.2, 0, TAU); g.fill();
  limb(g, [at(-4, -69 + breath), at(3, -68 + breath)], 2.2, '#c8ccd6');
  limb(g, [at(-9, -56 + breath), at(-11, -56 + breath)], 0.9, '#2a1a1a');

  // the xiao flute, held toward her
  const m = at(-11, -51 + breath), tip = at(-27, -21);
  limb(g, [m, tip], 2.3, '#cdb06e');
  const hA = [lerp(m[0], tip[0], 0.4), lerp(m[1], tip[1], 0.4)];
  const hB = [lerp(m[0], tip[0], 0.68), lerp(m[1], tip[1], 0.68)];
  limb(g, [at(-7, -44 + breath), at(-12, -33), hB], 4.2, '#3c4d7e');
  limb(g, [at(-3, -45 + breath), at(-9, -40), hA], 4.2, '#4a5c90');
  poly(g, [at(-12, -33), hB, [hB[0] + 2, hB[1] + 10], at(-8, -20)], 'rgba(60,77,126,0.95)');
  g.fillStyle = SKIN;
  g.beginPath(); g.arc(...hA, 2.1, 0, TAU); g.fill();
  g.beginPath(); g.arc(...hB, 2.1, 0, TAU); g.fill();

  // glowing motes rising from the flute's song
  const play = smooth(4.5, 6, t);
  for (let i = 0; i < 12; i++) {
    const age = mod(t * 0.8 + i / 12 * 3, 3);
    const x = tip[0] - age * 22 + Math.sin(age * 3 + i) * 6;
    const y = tip[1] - 10 - age * 30;
    const a = play * Math.sin(Math.PI * age / 3) * 0.8;
    glow(g, x, y, 6, '255,232,190', a);
  }
}

function drawBoat(t, roll) {
  const g = bctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, boatC.width, boatC.height);
  g.setTransform(BS, 0, 0, BS, BOX, BOY);
  g.rotate(roll);
  g.save();
  g.beginPath(); g.rect(-BOX / BS - 50, -BOY / BS - 50, boatC.width / BS + 100, BOY / BS + 50.5); g.clip();

  // hull
  const hg = g.createLinearGradient(0, -36, 0, 8);
  hg.addColorStop(0, '#4a2e1d'); hg.addColorStop(1, '#170d08');
  g.beginPath();
  g.moveTo(-170, -32);
  g.quadraticCurveTo(-140, -14, -100, -12); g.lineTo(100, -12);
  g.quadraticCurveTo(145, -14, 178, -37);
  g.quadraticCurveTo(160, -6, 120, 8); g.lineTo(-120, 8);
  g.quadraticCurveTo(-158, -4, -170, -32);
  g.closePath(); g.fillStyle = hg; g.fill();
  g.beginPath(); g.moveTo(-170, -32);
  g.quadraticCurveTo(-140, -14, -100, -12); g.lineTo(100, -12); g.quadraticCurveTo(145, -14, 178, -37);
  g.strokeStyle = '#94603a'; g.lineWidth = 3; g.stroke();
  g.strokeStyle = 'rgba(255,214,190,0.35)'; g.lineWidth = 1; g.stroke();
  g.beginPath(); g.moveTo(-158, -20); g.quadraticCurveTo(-120, -3, -80, -3); g.lineTo(90, -3); g.quadraticCurveTo(140, -4, 166, -24);
  g.strokeStyle = 'rgba(140,90,60,0.4)'; g.lineWidth = 1.2; g.stroke();

  // woven bamboo canopy
  const cg = g.createLinearGradient(0, -60, 0, -12);
  cg.addColorStop(0, '#5a4a32'); cg.addColorStop(1, '#2a2117');
  g.beginPath();
  g.moveTo(4, -12); g.quadraticCurveTo(4, -56, 30, -59); g.lineTo(76, -59); g.quadraticCurveTo(102, -56, 102, -12);
  g.closePath(); g.fillStyle = cg; g.fill();
  g.strokeStyle = 'rgba(20,14,8,0.55)'; g.lineWidth = 1;
  for (let x = 14; x < 100; x += 9) { g.beginPath(); g.moveTo(x, -12); g.lineTo(x + (x < 53 ? -2 : 2), -57); g.stroke(); }
  g.strokeStyle = 'rgba(255,220,180,0.12)';
  for (let y = -50; y < -14; y += 7) { g.beginPath(); g.moveTo(7, y); g.lineTo(99, y); g.stroke(); }
  g.beginPath(); g.moveTo(5, -40); g.quadraticCurveTo(8, -57, 30, -59); g.lineTo(76, -59);
  g.strokeStyle = 'rgba(255,220,190,0.3)'; g.lineWidth = 1.5; g.stroke();

  // his sword resting against the canopy
  limb(g, [[2, -12], [12, -60]], 3.2, '#1e1a22');
  limb(g, [[8.5, -44], [13.5, -45]], 2.2, '#c9cfd8');
  ribbon(g, 12, -60, 18, 2, 1, 1.75, 0.3, t, 0.5, 6, 4, '#c42c36');

  // lantern pole at the bow
  limb(g, [[150, -18], [160, -70], [166, -104]], 2.6, '#2a1a10');
  const sway = Math.sin(t * 1.7) * 0.14;
  const lx = 166 + Math.sin(sway) * 20, ly = -104 + Math.cos(sway) * 20;
  limb(g, [[166, -104], [lx, ly]], 0.8, '#2a1a10');
  g.save(); g.translate(lx, ly + 11); g.rotate(-sway);
  const lgr = g.createRadialGradient(0, -2, 1, 0, 0, 12);
  lgr.addColorStop(0, '#ffd27a'); lgr.addColorStop(0.5, '#f0502e'); lgr.addColorStop(1, '#a8201c');
  g.fillStyle = lgr; g.beginPath(); g.ellipse(0, 0, 9, 11.5, 0, 0, TAU); g.fill();
  g.fillStyle = '#d4a548'; g.fillRect(-5, -13, 10, 3); g.fillRect(-5, 10, 10, 3);
  limb(g, [[0, 13], [Math.sin(t * 2.3) * 2, 26]], 1.4, '#c42c36');
  g.restore();

  drawMan(g, t);
  drawWoman(g, t);
  g.restore();
  return { lx, ly: ly + 11 };
}

function boatPos(t) {
  const u = clamp(t / DUR, 0, 1);
  return {
    x: -240 + 920 * (1 - Math.pow(1 - u, 1.6)),
    y: 600 + Math.sin(t * 1.6) * 2.2,
    roll: Math.sin(t * 1.3) * 0.012,
  };
}

function drawBoatComposite(t) {
  const B = boatPos(t);
  const lantern = drawBoat(t, B.roll);
  const ox = B.x - BOX, oy = B.y - BOY;

  // soft V-shaped wake trailing the stern, and a ripple at the bow
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const sx = B.x - 160 * BS;
  for (let k = 0; k < 18; k++) {
    const age = k + mod(t * 1.5, 1);
    const a = 0.13 * (1 - age / 19);
    const cx = sx - age * 16, spread = 3 + age * 2.2, len = 10 + age * 1.5;
    ctx.strokeStyle = `rgba(255,222,222,${a})`; ctx.lineWidth = 1.1;
    for (const side of [-1, 1]) {
      const y = B.y + 2 + side * spread * 0.35;
      ctx.beginPath(); ctx.moveTo(cx - len / 2, y); ctx.lineTo(cx + len / 2, y); ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(255,230,230,0.35)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(B.x + 120 * BS, B.y + 2); ctx.quadraticCurveTo(B.x + 160 * BS, B.y, B.x + 182 * BS, B.y - 2); ctx.stroke();
  ctx.restore();

  // reflection of the boat and its people
  for (let r = 0; r < 200; r += 2) {
    const dx = Math.sin(r * 0.25 - t * 3) * (1 + r * 0.05);
    ctx.globalAlpha = 0.42 * (1 - r / 200);
    ctx.drawImage(boatC, 0, BOY - r - 2, boatC.width, 2, ox + dx, B.y + r, boatC.width, 2);
  }
  ctx.globalAlpha = 1;

  // the pole below the surface, and rings where it meets the water
  const P = poleGeom(t);
  const ex = B.x + P.entry[0] * BS, ey = B.y + P.entry[1] * BS;
  ctx.strokeStyle = 'rgba(40,50,40,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex + P.d[0] * 65, ey + P.d[1] * 65); ctx.stroke();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 3; k++) {
    const u = mod(t * 0.7 + k / 3, 1);
    ctx.strokeStyle = `rgba(255,228,220,${0.35 * (1 - u)})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(ex, ey + 1, 4 + u * 34, (4 + u * 34) * 0.22, 0, 0, TAU); ctx.stroke();
  }
  ctx.restore();

  ctx.drawImage(boatC, ox, oy);

  // lantern light
  const LX = B.x + lantern.lx * BS, LY = B.y + lantern.ly * BS;
  const fl = 0.9 + 0.1 * Math.sin(t * 11) * Math.sin(t * 7.3);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  glow(ctx, LX, LY, 120, '255,140,70', 0.35 * fl);
  glow(ctx, LX, LY, 34, '255,210,150', 0.5 * fl);
  ctx.translate(LX, B.y + 56); ctx.scale(0.18, 1);
  glow(ctx, 0, 0, 60, '255,150,80', 0.28 * fl);
  ctx.restore();
  return B;
}

// ---------------------------------------------------------------- foreground
function drawPetals(t) {
  for (const p of petals) {
    const x = mod(p.x0 + p.vx * t + Math.sin(t * 0.9 + p.ph) * p.sw, W + 100) - 50;
    const y = mod(p.y0 + p.vy * t, H + 40) - 20;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot + t * p.rs);
    ctx.scale(1, 0.25 + 0.75 * Math.abs(Math.sin(t * 2 + p.ph)));
    ctx.fillStyle = `rgba(${p.c},${p.s > 4 ? 0.7 : 0.88})`;
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.6, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawFireflies(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of fireflies) {
    const x = mod(f.x + Math.sin(t * f.f + f.ph) * f.a - t * 6, W);
    const y = f.y + Math.cos(t * f.f * 1.3 + f.ph) * f.a * 0.4;
    const a = Math.pow(0.5 + 0.5 * Math.sin(t * 2.2 * f.f * 3 + f.ph), 3);
    glow(ctx, x, y, 9, '255,236,150', 0.7 * a);
  }
  ctx.restore();
}

function drawText(t) {
  const fontCN = '"Ma Shan Zheng", "STKaiti", "KaiTi", serif';
  const fontEN = 'italic 500 28px "Cormorant Garamond", Georgia, serif';
  const block = (cn, en, size, a, y) => {
    if (a <= 0.001) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textBaseline = 'alphabetic';
    ctx.font = `${size}px ${fontCN}`;
    ctx.shadowColor = 'rgba(255,170,150,0.7)'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#fff3e6';
    ctx.letterSpacing = '6px';
    ctx.fillText(cn, 96, y);
    const w = ctx.measureText(cn).width;
    ctx.shadowBlur = 10;
    ctx.letterSpacing = '1.5px';
    ctx.font = fontEN;
    ctx.fillStyle = 'rgba(255,232,220,0.92)';
    ctx.fillText(en, 100, y + 46);
    // red seal stamp
    ctx.shadowBlur = 0; ctx.letterSpacing = '0px';
    ctx.translate(96 + w + 22, y - size * 0.62); ctx.rotate(-0.05);
    ctx.fillStyle = '#b3242c'; ctx.fillRect(0, 0, 40, 40);
    ctx.strokeStyle = 'rgba(255,230,220,0.85)'; ctx.lineWidth = 1.5; ctx.strokeRect(3, 3, 34, 34);
    ctx.fillStyle = '#fff1ea'; ctx.font = `30px ${fontCN}`; ctx.textAlign = 'center';
    ctx.fillText('情', 20, 31);
    ctx.restore();
  };
  block('月下扁舟', 'A Boat Beneath the Moon', 88, fadeWin(t, 1.4, 3.2, 6.2, 7.6), 150);
  block('江湖路远 与君同舟', 'However far the rivers run, I will row with you.', 64, fadeWin(t, 13.6, 15.4, 30, 31), 140);
}

// ---------------------------------------------------------------- frame
function renderAt(t) {
  const cam = t * 16;
  drawSky(t, cam);
  ctx.drawImage(sky, 0, 0);
  drawWater(t, cam);

  const boatDepth = (boatPos(t).y - HORIZON) / (H - HORIZON);
  for (const L of riverLanterns) if (L.d < boatDepth) drawRiverLantern(L, t, cam);
  drawBoatComposite(t);
  for (const L of riverLanterns) if (L.d >= boatDepth) drawRiverLantern(L, t, cam);

  drawFireflies(t);
  drawPetals(t);

  const v = ctx.createRadialGradient(W / 2, H * 0.52, 280, W / 2, H * 0.52, 820);
  v.addColorStop(0, 'rgba(6,5,18,0)'); v.addColorStop(1, 'rgba(6,5,18,0.6)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  drawText(t);

  const black = clamp(1 - smooth(0, 2.4, t) + smooth(18.8, 20, t), 0, 1);
  if (black > 0) { ctx.fillStyle = `rgba(0,0,0,${black})`; ctx.fillRect(0, 0, W, H); }
}

async function ready() {
  try {
    await Promise.all([
      document.fonts.load('88px "Ma Shan Zheng"', '月下扁舟江湖路远与君同舟情'),
      document.fonts.load('italic 500 28px "Cormorant Garamond"', 'A Boat'),
    ]);
  } catch (e) { /* fall back to system fonts */ }
  await document.fonts.ready;
}

window.DUR = DUR;
window.renderAt = renderAt;
window.sceneReady = ready();

if (!new URLSearchParams(location.search).has('render')) {
  window.sceneReady.then(() => {
    const start = performance.now();
    const loop = (now) => { renderAt(((now - start) / 1000) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
